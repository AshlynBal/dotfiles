###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

### Scripts

$find-else-open = ~/.config/hypr/scripts/find_else_run.sh
$rofi-cliphist = ~/.config/cliphist/scripts/cliphist-rofi-img.sh
$adjust-volume = ~/.config/hypr/scripts/adjust_volume.sh
$toggle-touchpad = ~/.config/hypr/scripts/./toggle_touchpad.sh
$restart-waybar = ~/.config/hypr/scripts/./restart_waybar.sh
$restart-autostart = ~/.config/hypr/scripts/./restart_programs.sh
$snappy-switch = ~/.config/hypr/scripts/./snappy-switcher-script.sh
$menu = rofi -show drun
$hypr-exec = hyprctl dispatch exec


### Laptop Lid
# Trigger when the switch is toggled.
bindl = , switch:Lid Switch, exec, hyprlock
# bindl = , switch:Lid Switch, exec, systemctl suspend

### Binds

bind = $mainMod, W, killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, F, togglefloating,
bind = $mainMod SHIFT, F, fullscreen
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, C, centerwindow

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch focused monitor with mainMod + CTRL + arrow keys
bind = $mainMod CTRL, left, focusmonitor, +1
bind = $mainMod CTRL, right, focusmonitor, -1

# Move windows to monitor with mainMod + SHIFT + CTRL + arrow keys
bind = $mainMod SHIFT CTRL, left, movewindow, mon:l
bind = $mainMod SHIFT CTRL, right, movewindow, mon:r

# Move through workspaces with mainMod + ALT + arrow keys
bind = $mainMod alt, left, split-cycleworkspaces, -1
bind = $mainMod alt, right, split-cycleworkspaces, +1

# Move focused window to workspace with mainMod + SHIFT + ALT + arrow keys
bind = $mainMod SHIFT ALT, left, split-movetoworkspace, -1
bind = $mainMod SHIFT ALT, right, split-movetoworkspace, +1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split-movetoworkspace, 1
bind = $mainMod SHIFT, 2, split-movetoworkspace, 2
bind = $mainMod SHIFT, 3, split-movetoworkspace, 3
bind = $mainMod SHIFT, 4, split-movetoworkspace, 4
bind = $mainMod SHIFT, 5, split-movetoworkspace, 5
bind = $mainMod SHIFT, 6, split-movetoworkspace, 6
bind = $mainMod SHIFT, 7, split-movetoworkspace, 7
bind = $mainMod SHIFT, 8, split-movetoworkspace, 8
bind = $mainMod SHIFT, 9, split-movetoworkspace, 9
bind = $mainMod SHIFT, 0, split-movetoworkspace, 10

# Switch monitors with mainMod + CTRL + [0-9]
bind = $mainMod CTRL, 1, focusmonitor, 0
bind = $mainMod CTRL, 2, focusmonitor, 1
bind = $mainMod CTRL, 3, focusmonitor, 2
bind = $mainMod CTRL, 4, focusmonitor, 3
bind = $mainMod CTRL, 5, focusmonitor, 4
bind = $mainMod CTRL, 6, focusmonitor, 5
bind = $mainMod CTRL, 7, focusmonitor, 6
bind = $mainMod CTRL, 8, focusmonitor, 7
bind = $mainMod CTRL, 9, focusmonitor, 8
bind = $mainMod CTRL, 0, focusmonitor, 9

# Move to monitor with mainMod + SHIFT + CTRL + [0-9]
bind = $mainMod SHIFT CTRL, 1, movewindow, mon:0
bind = $mainMod SHIFT CTRL, 2, movewindow, mon:1
bind = $mainMod SHIFT CTRL, 3, movewindow, mon:2
bind = $mainMod SHIFT CTRL, 4, movewindow, mon:3
bind = $mainMod SHIFT CTRL, 5, movewindow, mon:4
bind = $mainMod SHIFT CTRL, 6, movewindow, mon:5
bind = $mainMod SHIFT CTRL, 7, movewindow, mon:6
bind = $mainMod SHIFT CTRL, 8, movewindow, mon:7
bind = $mainMod SHIFT CTRL, 9, movewindow, mon:8
bind = $mainMod SHIFT CTRL, 0, movewindow, mon:9

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_up, split-cycleworkspaces, -1
bind = $mainMod, mouse_down, split-cycleworkspaces, +1

# Go to previous workspace on monitor
bind = $mainMod, Z, workspace, previous
# bind = $mainMod, Z, workspace, previous_per_monitor
# bind = $mainMod, mouse:275, workspace, previous_per_monitor

# bind = $mainMod SHIFT, Z, movewindow, previous_per_monitor

# Gaming workspace
bind = $mainMod, G, workspace, name:gaming
bind = $mainMod SHIFT, G, movetoworkspace, name:gaming

# Discord workspace
bind = $mainMod, D, exec, $find-else-open discord discord name:discord
bind = $mainMod SHIFT, D, movetoworkspace, name:discord

# Obsidian workspace
bind = $mainMod, O, exec, $find-else-open obsidian obsidian name:obsidian
bind = $mainMod SHIFT, O, movetoworkspace, name:obsidian
# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindm = $mainMod SHIFT, Z, movewindow
bindm = $mainMod SHIFT, X, resizewindow

# Laptop multimedia keys for volume and LCD brightness
$beep = canberra-gtk-play -i audio-volume-change

bindel = , XF86AudioRaiseVolume, exec, $adjust-volume 5%+
bindel = , XF86AudioLowerVolume, exec, $adjust-volume 5%-
bindel = SHIFT, XF86AudioRaiseVolume, exec, $adjust-volume 1%+
bindel = SHIFT, XF86AudioLowerVolume, exec, $adjust-volume 1%-
bindel = CTRL, XF86AudioRaiseVolume, exec, $adjust-volume 25%+
bindel = CTRL, XF86AudioLowerVolume, exec, $adjust-volume 25%-
# bindel = CTRL SHIFT, XF86AudioRaiseVolume, exec, $adjust-volume 25%+
# bindel = CTRL SHIFT, XF86AudioLowerVolume, exec, $adjust-volume 25%-

bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = SHIFT, XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 1%+
bindel = SHIFT, XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 1%-
bindel = CTRL, XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 25%+
bindel = CTRL, XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 25%-
# bindel = CTRL SHIFT, XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 25%+
# bindel = CTRL SHIFT, XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 25%-


# Toggle touchpad

bind = $mainMod, F4, exec, $toggle-touchpad

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Restart Waybar
bind = $mainMod, R, exec, $restart-autostart

### Start Programs
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, T, exec, $textEditor
# Discord and Obsidian above in switching workspaces

### Open Menus
bind = $mainMod, SPACE, exec, $menu
# Logout managerbb
bind = $mainMod, M, exec, wlogout
# SwayNotificationCenter
bind = $mainMod, N, exec, swaync-client -t -sw
# Clipboard manager
# bind = $mainMod, V, exec, rofi -modi clipboard:$rofi-cliphist -show clipboard -show-icons
bind = SUPER, V, exec, cursor-clip


# Snappy Switcher
bind = ALT, Tab, exec, snappy-switcher next
bind = ALT SHIFT, Tab, exec, snappy-switcher prev
# bind = ALT, up, exec, $snappy-switch prev 5
# bind = ALT, down, exec, $snappy-switch next 5
# bind = ALT, right, exec, snappy-switcher next
# bind = ALT, left, exec, snappy-switcher prev

### Hyprshot
# Found in hyprshot.conf


### Hyprpicker
bind = $mainMod SHIFT, P, exec, hyprpicker --autocopy

